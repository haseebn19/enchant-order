<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply the saved theme before the page draws. Storage can be blocked, so this may fail.
      try {
        var t = localStorage.getItem('enchant-order-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/gif" href="./images/book.gif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calculate the optimal enchantment order for your Minecraft items to minimize anvil costs."
    />
    <meta name="theme-color" content="#1a1612" />
    <link rel="apple-touch-icon" href="./icon-192x192.png" />
    <title>Minecraft Enchantment Order</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
